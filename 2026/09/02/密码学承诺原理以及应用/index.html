<script>
// 等页面加载完成后执行
window.addEventListener('load', function() {
  const content = document.querySelector('.content-article');
  const tocList = document.getElementById('toc-list');
  const tocPanel = document.getElementById('toc-panel');
  
  // 如果没有文章内容，隐藏目录
  if (!content || !tocList) {
    if (tocPanel) tocPanel.style.display = 'none';
    return;
  }

  // 获取所有h2、h3、h4标题（Markdown的##/###/####）
  const headers = content.querySelectorAll('h2, h3, h4');
  if (headers.length === 0) {
    if (tocPanel) tocPanel.style.display = 'none';
    return;
  }

  // 清空目录
  tocList.innerHTML = '';

  // 生成目录项
  headers.forEach((header, index) => {
    // 给标题加id（如果Hexo没自动生成的话）
    if (!header.id) {
      header.id = 'toc-' + index;
    }

    const li = document.createElement('li');
    // 根据标题级别加类名，实现缩进
    if (header.tagName === 'H3') {
      li.classList.add('toc-level-3');
    } else if (header.tagName === 'H4') {
      li.classList.add('toc-level-4');
    }

    const a = document.createElement('a');
    a.href = '#' + header.id;
    a.textContent = header.textContent;
    // 点击跳转（平滑滚动）
    a.addEventListener('click', function(e) {
      e.preventDefault();
      header.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    li.appendChild(a);
    tocList.appendChild(li);
  });

  // 滚动监听，高亮当前目录项
  const tocItems = tocList.querySelectorAll('li');
  const headerList = Array.from(headers);

  window.addEventListener('scroll', function() {
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    let currentIndex = 0;

    // 找到当前滚动位置对应的标题
    for (let i = 0; i < headerList.length; i++) {
      const headerTop = headerList[i].offsetTop - 100;
      if (scrollTop >= headerTop) {
        currentIndex = i;
      }
    }

    // 高亮当前项
    tocItems.forEach((item, index) => {
      if (index === currentIndex) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  });
});
</script>
